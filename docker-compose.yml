# GramVault docker-compose — see docs/DESIGN.md §H2.
#
#   cp config.example.yaml config.yaml     # then edit paths/models
#   touch secrets.yaml                     # so the Models UI can save API keys
#   docker compose up -d --build
#
# NETWORKING
#   This uses `network_mode: host` so the server binds the host's interfaces
#   directly — the Tailscale-IP bind then happens in-app and survives Docker
#   starting before tailscale0 has an address (see §H2 / W2). Set
#   `server.host` in config.yaml to 127.0.0.1 (local only) or your Tailscale
#   IP (100.x.y.z). Binding anything non-loopback with no `auth.token` set
#   is refused at startup unless `--insecure` is passed.
#   If you would rather use a bridge network, drop `network_mode: host`, add
#   `ports: ["127.0.0.1:8000:8000"]`, set GRAMVAULT_SERVER__HOST=0.0.0.0, and
#   point GRAMVAULT_OLLAMA__HOST at host.docker.internal (+ extra_hosts).
#
# OLLAMA
#   Not a service here — with host networking the container reaches the
#   host's native Ollama at 127.0.0.1:11434 (the config.yaml default). To run
#   Ollama in a container instead, uncomment the `ollama` service below.
#
# FILE OWNERSHIP
#   `user:` runs the process as your host uid so it can write the bind-mounted
#   data/, config.yaml, secrets.yaml and vault. Override per-host with a .env
#   file: GRAMVAULT_UID=$(id -u)  GRAMVAULT_GID=$(id -g)

services:
  gramvault:
    build:
      context: .
      dockerfile: Dockerfile
    image: gramvault:local
    restart: unless-stopped
    network_mode: host
    user: "${GRAMVAULT_UID:-1000}:${GRAMVAULT_GID:-1000}"
    environment:
      # Host's native Ollama (host networking → localhost is the host).
      - GRAMVAULT_OLLAMA__HOST=http://127.0.0.1:11434
      # Fixed in-container paths, matched to the bind mounts below. These
      # override paths.* in config.yaml so the same config.yaml works both
      # in and out of the container.
      - GRAMVAULT_PATHS__DB_PATH=/data/gramvault.db
      - GRAMVAULT_PATHS__CHROMA_DIR=/data/chroma
      - GRAMVAULT_PATHS__LIBRARY_DIR=/library
      # §F: the cached Instagram session lives at the bind-mount target below.
      - GRAMVAULT_PULL__SESSION_DIR=/data/instaloader
    volumes:
      # config.yaml + secrets.yaml are writable: Settings → Obsidian/Models
      # persist back to them.
      - ./config.yaml:/app/config.yaml
      - ./secrets.yaml:/app/secrets.yaml
      # SQLite db, Chroma, video keyframes (db_path.parent/keyframes), the
      # whisper model cache (HF_HOME).
      - ./data:/data
      # Imported media. media_files.file_path rows are stored relative to
      # this dir, so it can live anywhere on the host.
      - ./library:/library
      # §F Instagram session dir — carries over an existing host login
      # (~/.config/instaloader/session-<user>). Drop this line to keep the
      # session inside ./data/instaloader instead.
      - ${HOME}/.config/instaloader:/data/instaloader
      # Obsidian vault — uncomment and set the host path to export into it.
      # Must match `paths.obsidian_vault_dir: /vault` in config.yaml.
      # - /path/to/your/Obsidian/vault:/vault

  # --- Optional: run Ollama in a container instead of on the host ---
  # Also uses host networking so it stays reachable at 127.0.0.1:11434.
  # ollama:
  #   image: ollama/ollama:latest
  #   restart: unless-stopped
  #   network_mode: host
  #   volumes:
  #     - ./data/ollama:/root/.ollama
