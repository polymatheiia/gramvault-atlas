# GramVault configuration template.
#
# Copy this file to `config.yaml` (already done for you in a fresh checkout —
# config.yaml ships with the same defaults) and adjust paths/models to taste.
# Every path below is relative to the current working directory unless it is
# absolute. Nothing in the codebase should ever hardcode a path — everything
# flows through this file (see backend/gramvault/config.py).
#
# All values can be overridden with environment variables using a
# double-underscore delimiter for nesting, e.g.:
#   GRAMVAULT_SERVER__PORT=9000
#   GRAMVAULT_PATHS__LIBRARY_DIR=/mnt/data/library

paths:
  # Where imported media (photos/videos) is stored after unpacking an export.
  library_dir: "./library"
  # SQLite database file (authors, items, media_files, tags, jobs, chat...).
  db_path: "./data/gramvault.db"
  # ChromaDB persistent vector store directory.
  chroma_dir: "./data/chroma"
  # Obsidian vault to export Markdown notes into. Null until the user
  # configures one; Agent A6 (Obsidian exporter) should refuse to run if unset.
  obsidian_vault_dir: null

models:
  # Legacy flat model config. Still honoured: any AI task the `ai:` block
  # below doesn't cover falls back to these (on the `ollama` host).
  chat_model: "llama3.1:8b"
  vision_model: "llava:7b"
  embedding_model: "nomic-embed-text"

ollama:
  # Base URL for the Ollama server. Defaults to the standard local install.
  host: "http://localhost:11434"

# Per-task provider/model selection. Omit a task to fall back to `models:`
# above. Manage this from the Models settings page instead of by hand.
#
# ai:
#   chat:       {provider: anthropic, model: claude-sonnet-5}
#   categorize: {provider: anthropic, model: claude-haiku-4-5}
#   vision:     {provider: ollama,    model: minicpm-v}
#   embedding:  {provider: ollama,    model: bge-m3}   # keep local — changing it
#                                                      # re-embeds the whole library
# providers:
#   anthropic:  {kind: anthropic, api_key_env: ANTHROPIC_API_KEY}
#   openrouter: {kind: openai, base_url: "https://openrouter.ai/api/v1"}
#   lmstudio:   {kind: openai, base_url: "http://localhost:1234/v1"}
#
# API keys live in `secrets.yaml` beside this file (gitignored, chmod 600),
# not here:
#   providers:
#     anthropic: {api_key: "sk-ant-..."}
#   auth:
#     token: "a-long-random-string"   # then every /api/* call needs
#                                     # Authorization: Bearer <token>

export:
  # Subfolder created inside `paths.obsidian_vault_dir` for the notes.
  default_vault_subfolder: "GramVault"
  # "copy" media into the vault and embed it, or "link" out to the original.
  media_mode: "copy"
  # Note foldering: "flat", "by-category" (<category>/<note>.md), or
  # "by-date" (<YYYY-MM>/<note>.md). A re-export moves notes when this or
  # an item's category changes; user notes below `%% gramvault:end %%` and
  # extra frontmatter keys are always preserved.
  layout: "flat"

# Optional: pull your own *saved* posts straight from Instagram instead of
# waiting for a data export (integration plan §F). Off by default — it needs
# a logged-in session, runs against Instagram's private endpoints, and is
# rate-limited by them. Requires the extra: pip install -e ".[instagram]".
# pull:
#   enabled: true
#   session_dir: "~/.config/instaloader"   # where the session-<user> file is cached
#   max_default: 400                       # default cap on how far back one pull walks

chunking:
  # Text chunking parameters for embeddings (captions, transcripts, notes).
  chunk_size: 512
  chunk_overlap: 64

video:
  # ffmpeg keyframe extraction settings for videos/reels.
  keyframe_interval_seconds: 5
  max_keyframes: 6

server:
  host: "127.0.0.1"
  port: 8000
